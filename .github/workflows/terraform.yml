# The entry point. Holds no steps of its own: it calls one workflow per
# category, then the plan or the apply depending on what the event means.
#
# The file name is a public interface. The Makefile in this repository and
# doctor.sh both dispatch terraform.yml by name, so renaming it breaks them
# silently.
name: terraform

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  # Triggered by hand, and by the Makefile that drives this repository. The
  # event alone no longer says what to do, because a manual run could mean
  # either, so the choice is an input and the two jobs below read it.
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run'
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/ci-lint.yml

  secrets:
    uses: ./.github/workflows/ci-secrets.yml

  iac:
    uses: ./.github/workflows/ci-iac.yml

  plan:
    needs: [lint, secrets, iac]
    if: github.event_name == 'pull_request' || inputs.action == 'plan'
    # A called workflow cannot hold more than its caller grants it. The plan
    # posts itself on the pull request, hence pull-requests: write.
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    # secrets: inherit would hand the called workflow every secret this
    # repository holds. It needs one.
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    uses: ./.github/workflows/cd-plan.yml

  apply:
    needs: [lint, secrets, iac]
    if: github.event_name == 'push' || inputs.action == 'apply'
    permissions:
      contents: read
      id-token: write
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    uses: ./.github/workflows/cd-apply.yml
