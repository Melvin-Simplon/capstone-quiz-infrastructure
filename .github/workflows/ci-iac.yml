# The configuration read as infrastructure: open ports, public endpoints,
# missing encryption, and the rest of what Trivy knows about Terraform.
#
# This is the equivalent of the SAST category in the two application
# repositories. It reads the configuration, not the code that runs on it.
#
# Called from terraform.yml.
name: IaC

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Trivy reads the configuration from the working tree. Without a checkout
      # it scans an empty runner, finds nothing, and reports success: the check
      # stays green while guarding nothing.
      - uses: actions/checkout@v7

      - name: Scan the configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
