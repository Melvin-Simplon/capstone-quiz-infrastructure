name: terraform

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

# The remote state is a single shared lock. Serialising the workflow avoids a run
# failing on a lock held by another one instead of on a real problem.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Init
        run: terraform init -input=false

      - name: Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan | tee plan.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Comment plan on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            // GitHub rejects comments over 65536 characters.
            const body = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n... truncated, see the job log for the full plan.'
              : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform plan\n\n```terraform\n' + body + '\n```',
            });

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: nonprod
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Init
        run: terraform init -input=false

      # Planning again rather than reusing the pull request artifact: main may have
      # moved since, and a plan file is only valid against the state it was built on.
      - name: Apply
        run: terraform apply -input=false -auto-approve -lock-timeout=120s
