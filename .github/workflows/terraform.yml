name: terraform

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

# Elevated only in the jobs that need it, rather than granted to the whole file.
permissions:
  contents: read

# The remote state is a single shared lock. Serialising the workflow avoids a run
# failing on a lock held by another one instead of on a real problem.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive

      # -backend=false: validation needs no state, and this job deliberately
      # holds no Azure identity, so a broken configuration is still caught when
      # the OIDC trust is down.
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan:
    needs: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      # Jobs run on separate runners and share no filesystem, so the init done
      # in lint is gone. Ordering through needs carries no state.
      - name: Init
        run: terraform init -input=false

      # shell: bash brings pipefail. Without it the pipeline returns the status
      # of tee, which always succeeds, and a failing plan would leave the job green.
      - name: Plan
        shell: bash
        run: terraform plan -input=false -no-color -lock-timeout=120s | tee plan.txt

      - name: Comment plan on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            // GitHub rejects comments over 65536 characters.
            const body = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n... truncated, see the job log for the full plan.'
              : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform plan\n\n```terraform\n' + body + '\n```',
            });

  apply:
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: nonprod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Init
        run: terraform init -input=false

      # Planning again rather than reusing the pull request artifact: main may have
      # moved since, and a plan file is only valid against the state it was built on.
      - name: Apply
        run: terraform apply -input=false -auto-approve -lock-timeout=120s
