name: CI - Build module

on:
  pull_request:
    branches: [develop, main]
  workflow_call:
    inputs:
      lint_only:
        description: Skip the plan, for a caller about to apply.
        type: boolean
        default: false
    secrets:
      TF_API_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Lint (Terraform fmt and validate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Check the formatting and the validity
        run: scripts/workflows/ci/validate-the-configuration.sh

  tflint:
    name: Lint (tflint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0

      - name: Lint the provider usage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/workflows/ci/lint-the-provider-usage.sh

  plan:
    name: Plan (Terraform)
    needs: [terraform, tflint]
    if: ${{ !inputs.lint_only && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: terraform-state-nonprod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Init
        run: terraform init -input=false

      - name: Sign in to Azure
        id: azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Open the Key Vault to this runner
        run: scripts/workflows/deploy/keyvault-firewall.sh add

      - name: Plan
        shell: bash
        run: terraform plan -input=false -no-color -lock-timeout=120s | tee plan.txt

      - name: Close the Key Vault again
        if: always() && steps.azure.outcome == 'success'
        run: scripts/workflows/deploy/keyvault-firewall.sh remove

      - name: Put the plan on the pull request and the summary page
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.number }}
        run: scripts/workflows/deploy/comment-the-plan.sh
