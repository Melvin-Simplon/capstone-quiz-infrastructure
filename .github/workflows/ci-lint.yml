# Does the configuration parse, is it formatted, and does it ask the provider
# for things the provider accepts.
#
# Called from terraform.yml. The one called workflow handed no secret: both jobs
# below run `terraform init -backend=false`, which skips the cloud block
# entirely, so neither needs the HCP Terraform token nor an Azure credential.
name: Lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Check the formatting and the validity
        run: scripts/workflows/ci/validate-the-configuration.sh

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0

      - name: Lint the provider usage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/workflows/ci/lint-the-provider-usage.sh
