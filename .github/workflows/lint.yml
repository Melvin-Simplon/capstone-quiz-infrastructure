name: lint

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive

      # -backend=false: validation needs no state, and the remote backend would
      # require Azure credentials this job deliberately does not have.
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
