name: CD - Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the resource group name to confirm the destruction'
        required: true
        type: string

permissions:
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: nonprod
    concurrency:
      group: terraform-state-nonprod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED: mpetitRG
        run: |
          if [ "$CONFIRM" != "$EXPECTED" ]; then
            echo "Expected the resource group name, got '$CONFIRM'. Nothing was touched." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Init
        run: terraform init -input=false

      - name: Sign in to Azure
        id: azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Open the Key Vault to this runner
        run: scripts/workflows/deploy/keyvault-firewall.sh add

      - name: Plan the destruction
        run: terraform plan -destroy -input=false -no-color -lock-timeout=120s

      - name: Destroy
        run: terraform destroy -input=false -auto-approve -lock-timeout=120s

      - name: Close the Key Vault again
        if: always() && steps.azure.outcome == 'success'
        run: scripts/workflows/deploy/keyvault-firewall.sh remove
