name: terraform destroy

# Deliberately its own file. Kept out of terraform.yml so that no push, no pull
# request and no future edit to a trigger there can ever reach a destroy: the
# only way in is someone opening this workflow and typing the resource group
# name by hand.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the resource group name to confirm the destruction'
        required: true
        type: string

permissions:
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # The state lives on HCP Terraform, which authenticates with a token and not
  # with the OIDC trust everything else here uses. It is the only long lived
  # credential in this project, and ADR 0013 records why it is worth its cost.
  # The lint job does not need it: `terraform init -backend=false` skips the
  # cloud block entirely, which was verified rather than assumed.
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: nonprod
    # Same group as plan and apply: the state is one blob, and a destroy racing
    # a plan would fight over the same lease.
    concurrency:
      group: terraform-state-nonprod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED: mpetitRG
        run: |
          if [ "$CONFIRM" != "$EXPECTED" ]; then
            echo "Expected the resource group name, got '$CONFIRM'. Nothing was touched." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Init
        run: terraform init -input=false

      - name: Sign in to Azure
        id: azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Open the Key Vault to this runner
        run: scripts/keyvault-firewall.sh add

      # Printed before anything is removed, so the job log carries a record of
      # what the run was about to take away.
      - name: Plan the destruction
        run: terraform plan -destroy -input=false -no-color -lock-timeout=120s

      # Runs to completion. ADR 0012 removed the seven prevent_destroy blocks,
      # so nothing stops this: the database, the storage account and the vault
      # go with the rest. What is left against an accident is the plan printed
      # above, the resource group name typed into the dispatch form, and the
      # approval on the nonprod environment.
      - name: Destroy
        run: terraform destroy -input=false -auto-approve -lock-timeout=120s

      # Conditioned on the sign in rather than on always(): when Terraform fails
      # at init the sign in never ran, and an unconditional close then fails
      # with "Please run 'az login'", adding a second error to a job that only
      # had one and burying the real cause.
      - name: Close the Key Vault again
        if: always() && steps.azure.outcome == 'success'
        run: scripts/keyvault-firewall.sh remove
